{% extends "base.html" %}
{% block page_title %}Edit Principal{% endblock %}
{% block topbar_badge %}Super Admin Panel{% endblock %}

{% block nav_links %}
<a href="{{ url_for('system.superadmin_dashboard') }}" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
<a href="{{ url_for('system.superadmin_organizations') }}" class="nav-link"><i class="fas fa-building"></i> Organizations</a>
<a href="{{ url_for('system.superadmin_principals') }}" class="nav-link active"><i class="fas fa-user-tie"></i> Principals</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 580px;">
    <h3 class="card-title"><i class="fas fa-user-edit"></i> Edit Principal — {{ principal.username }}</h3>
    <form method="POST" class="grid-2 mt-6">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="username" value="{{ principal.username }}" required>
        </div>
        <div class="form-group">
            <label>Login Email</label>
            <input type="email" name="email" value="{{ principal.email }}" required>
        </div>
        <div class="form-group">
            <label>New Password <span style="color:var(--text3);font-weight:400;font-size:0.8rem;">(leave blank to keep current)</span></label>
            <input type="password" name="password" placeholder="Min 8 characters" minlength="8">
        </div>
        <div class="form-group">
            <label>Assigned Organization</label>
            <select name="organization_id" required>
                {% for org in organizations %}
                <option value="{{ org.id }}" {% if org.id == principal.organization_id %}selected{% endif %}>{{ org.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="grid-column: 1 / -1; margin-top: 8px;">
            <div class="flex gap-3">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{{ url_for('system.superadmin_principals') }}" class="btn" style="background: var(--bg3); color: var(--text2);">Cancel</a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
