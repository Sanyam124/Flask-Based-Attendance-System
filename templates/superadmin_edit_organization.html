{% extends "base.html" %}
{% block page_title %}Edit Organization{% endblock %}
{% block topbar_badge %}Super Admin Panel{% endblock %}

{% block nav_links %}
<a href="{{ url_for('system.superadmin_dashboard') }}" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
<a href="{{ url_for('system.superadmin_organizations') }}" class="nav-link active"><i class="fas fa-building"></i> Organizations</a>
<a href="{{ url_for('system.superadmin_principals') }}" class="nav-link"><i class="fas fa-user-tie"></i> Principals</a>
{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px;">
    <h3 class="card-title"><i class="fas fa-edit"></i> Edit Organization</h3>
    <form method="POST" class="mt-6">
        <div class="form-group">
            <label>Organization Name</label>
            <input type="text" name="name" value="{{ org.name }}" required>
        </div>
        <div class="flex gap-3 mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
            <a href="{{ url_for('system.superadmin_organizations') }}" class="btn" style="background: var(--bg3); color: var(--text2);">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
